<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카테고리 메뉴</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #222222;
    --muted: #666666;
    --tile: #ffffff;
    --badge: #1ec800;
    --sans: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --fg: #f2f2f2;
      --muted: #a0a0a0;
      --tile: #1f1f1f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --fg: #f2f2f2;
    --muted: #a0a0a0;
    --tile: #1f1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .menu {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .menu::-webkit-scrollbar { display: none; }

  .item {
    flex: 0 0 auto;
    width: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--fg);
    position: relative;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--tile);
    display: grid;
    place-items: center;
    font-size: 26px;
    line-height: 1;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.05);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .item:hover .icon { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
  .item:focus-visible { outline: 3px solid var(--badge); outline-offset: 4px; border-radius: 12px; }
  .label {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
  }
  .badge {
    position: absolute;
    top: -6px;
    right: 0;
    background: #2f6bff;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 999px;
    line-height: 1;
  }

  @media (max-width: 380px) {
    .menu { padding: 20px 8px; }
    .item { width: 60px; }
    .icon { width: 52px; height: 52px; }
  }
</style>
</head>
<body>

<nav class="menu" aria-label="카테고리">
  <a class="item" href="#"><span class="icon" style="background:#eaf7ee" aria-hidden="true">🧹</span><span class="label">청소</span></a>
  <a class="item" href="#"><span class="icon" style="background:#fff4e6" aria-hidden="true">🛋️</span><span class="label">가구</span></a>
  <a class="item" href="#"><span class="icon" style="background:#fdecec" aria-hidden="true">🍚</span><span class="label">음식</span></a>
  <a class="item" href="#"><span class="icon" style="background:#e9f1ff" aria-hidden="true">🏃</span><span class="label">운동</span><span class="badge">추천</span></a>
</nav>

</body>
</html>
